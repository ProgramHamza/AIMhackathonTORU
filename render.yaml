# Render blueprint for the backend API (docs/deployment.md). Synthetic sample data only.
services:
  - type: web
    name: clinical-summary-desk-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt -r ../blocks14/prep/requirements.txt
    startCommand: python -m app.server --host 0.0.0.0 --patient ../sample-data/patient-9001-0001
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: GEMINI_API_KEY      # free-tier key; leave empty to run with templates only
        sync: false
      - key: GEMINI_API_KEY_2    # optional second free key (rotation)
        sync: false
      - key: ALLOW_IMPORT        # 1 lets visitors upload patient folders; 0 turns it off
        value: "1"
      - key: IMPORT_BUNDLE       # optional private secret file: imported at startup as the default patient
        value: /etc/secrets/patient-bundle.json
