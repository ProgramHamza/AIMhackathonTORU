# Evaluation cases for block 5 (prompt -> checklist).
#
# Labels are written by the team, not by clinicians, and need clinical review.
# split: dev cases may be used to tune the tree; held-out cases must not be.
#
# role_ok : acceptable most-specific roles (any one counts as correct)
# tasks   : task nodes that must be detected
# context : context nodes that must be detected
# top     : items that must be critical or high
# must    : items that must be on the checklist (any priority)
# forbid  : items that should not be on the checklist for this request
#
# D01-D05, the challenge situations, quote the challenge dataset and live in the gitignored
# eval/private/challenge-cases.yaml (eval/cases.py merges them in when present).

