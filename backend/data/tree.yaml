# Decision graph: which patient facts a role needs for a task.
#
# Layers
#   domains  : fact domains, based on the International Patient Summary (IPS) sections.
#              Every checklist item maps to one or more domains.
#   nodes    : role, task, context and concept nodes.
#              parent  : is-a edge. A matched node fully activates its ancestors
#                        (an unknown kind of surgeon still gets "perioperative").
#              implies : weighted edges to other nodes. A concept such as "colonoscopy"
#                        activates "invasive_procedure" and "region_gi" with that weight.
#   items    : checklist items (the questions a clinician wants answered).
#   rules    : hyperedges "when all these nodes are active, add / raise / suppress items".
#              Weight = priority (critical 1.0, high 0.7, normal 0.45) x weakest node activation.
#              A rule with more conditions overrides fewer for the items it mentions.
#   links    : weighted item -> item edges (one hop), e.g. anticoagulants -> coagulation.
#
# Matching terms are lower-case. Umlauts are folded (ä -> ae) before matching, so write
# either form. A trailing * matches any word ending ("anaesthe*" matches "anaesthetist");
# a leading * matches any word beginning ("*ectomy" matches "cholecystectomy").
#
# `sources` name the published checklist or guideline an item or rule is based on.
# All thresholds belong in block 6 filters, not here, and need clinical review.

version: 2
priorities: [critical, high, normal]

domains:
  problems: Active problems and diagnoses (IPS Problem List)
  past_problems: Resolved problems and past operations (IPS History of Past Problems)
  allergies: Allergies and intolerances (IPS)
  medications: Medication (IPS Medication Summary)
  procedures: Procedures, done or planned (IPS History of Procedures)
  results_lab: Laboratory results (IPS Diagnostic Results)
  results_pathology: Pathology and histology (IPS Diagnostic Results)
  results_imaging: Imaging and functional diagnostics (IPS Diagnostic Results)
  vital_signs: Vital signs and body measurements (IPS)
  devices: Implants and medical devices (IPS)
  functional_status: Function, cognition, performance status (IPS)
  social_history: Social history, support, substance use (IPS)
  family_history: Family history (not an IPS section, common in letters)
  pregnancy: Pregnancy (IPS)
  plan_of_care: Recommendations, planned care, follow-ups (IPS Plan of Care)
  alerts: Warnings such as CAVE entries (IPS Alerts)
  advance_directives: Advance directives and consent (IPS)
  encounters: Hospital stays and their reasons

sources:
  IPS: HL7 FHIR International Patient Summary, section list
  ESAIC: ESAIC 2025 guideline, preoperative assessment of adults, noncardiac surgery
  WHO-SSC: WHO Surgical Safety Checklist, Sign In
  ESC-NCS: ESC 2022 guideline, cardiovascular assessment for noncardiac surgery
  SAMPLE: SAMPLE / AMPLE emergency history
  ESUR: ESUR contrast media safety guideline
  ADA: ADA Standards of Care, diabetes review
  ESMO-MDT: ESMO breast cancer multidisciplinary work, tumour board datasets
  IPASS: I-PASS handover
  STOPP: STOPP/START v3 medication review

# ---------------------------------------------------------------------------
# Checklist items
# terms: words used to find evidence in documents (block 7 retrieval, flagging).
# ask:   phrases in the clinician's prompt that request the item explicitly.
#        An explicitly asked item is shown even if a rule suppresses it.
# codes: code prefixes that facts can match (ICD-10 for diagnoses, ATC for drugs).
# time_rule: current = state as of the as-of date, latest = most recent value,
#            history = all values over time.
# ---------------------------------------------------------------------------
items:
  allergies:
    label: {en: Allergies and reactions, de: Allergien und Reaktionen}
    question: Which allergies or intolerances are documented, with which reactions?
    domains: [allergies, alerts]
    time_rule: history
    terms:
      en: [allergy, allergic, intolerance, reaction, anaphylaxis]
      de: [allergie*, allergisch, unvertraeglichkeit, cave, reaktion, anaphylaxie]
      abbr: [km-allergie]
    ask: [allerg*, intoleran*]
    codes: {icd10: [Z88, T78, T88.6, T88.7]}
    sources: [IPS, WHO-SSC, SAMPLE]

  contrast_reaction:
    label: {en: Previous contrast media reaction, de: Frühere Kontrastmittelreaktion}
