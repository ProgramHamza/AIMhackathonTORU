      label: {en: Urinary tract infection, de: Harnwegsinfekt}
      match: [uti, utis, urinary tract infection*, urinary infection*, cystitis, pyelonephritis, hwi, harnwegsinfekt*, zystitis]
      implies: {symptom_infection: 1.0, region_kidney: 0.7}
    diabetic_foot:
      label: {en: Diabetic foot or leg ulcer, de: Diabetischer Fuß oder Ulcus}
      match: [foot ulcer, diabetic foot, leg ulcer, ulcus cruris, diabetischer fuss, gangrene, gangraen]
      implies: {focus_diabetes: 0.9, symptom_infection: 0.8}
    lumbar_puncture:
      label: {en: Lumbar puncture, de: Lumbalpunktion}
      match: [lumbar puncture, spinal tap, lp, lumbalpunktion, liquorpunktion]
      implies: {invasive_procedure: 1.0}
    central_line_port:
      label: {en: Port or central line, de: Port oder zentraler Venenkatheter}
      match: [port, port implantation, central line, central venous catheter, picc, cvc, zvk, portimplantation, portanlage]
      implies: {invasive_procedure: 1.0}
    thyroid:
      label: {en: Thyroid, de: Schilddrüse}
      match: [thyroid*, goitre, goiter, struma, schilddruese*]
      implies: {region_airway: 0.7}
    anaesthesia_clinic:
      label: {en: Pre-anaesthesia clinic, de: Anästhesie-Sprechstunde}
      match: [anaesthesia clinic, anesthesia clinic, pre-anaesthesia, pre-anesthesia, anaesthesie sprechstunde, anaesthesiesprechstunde, anaesthesieambulanz, praemedikationsambulanz]
      implies: {anaesthesiology: 1.0, preop: 1.0}
    endurance_sport:
      label: {en: Endurance sport, de: Ausdauersport}
      match: [marathon, triathlon, endurance, competitive sport, ausdauersport, wettkampf*]
      implies: {sports_medicine: 1.0}
    antihypertensive_drug:
      label: {en: Blood pressure drug named, de: Blutdruckmedikament genannt}
      match: ["*pril", "*sartan", "*olol", "*dipine", "*dipin", diuretic*, diuretik*, furosemid*, torasemid*, hydrochlorothiazid*, hctz, spironolacton*, blopress, beta blocker*, betablocker*, ace inhibitor*, ace-hemmer]
      implies: {}
    nsaid_drug:
      label: {en: Painkiller of the NSAID type, de: NSAR-Schmerzmittel}
      match: [nsaid*, nsar, ibuprofen, diclofenac, naproxen, voltaren, metamizol*, novalgin, painkiller*, schmerzmittel*, analgesic*]
      implies: {}
    opioid_drug:
      label: {en: Opioid, de: Opioid}
      match: [opioid*, opiat*, morphin*, oxycodon*, hydromorphon*, fentanyl, tramadol, tilidin*, buprenorphin*]
      implies: {}
    cancer_drug:
      label: {en: Cancer drug named, de: Krebsmedikament genannt}
      match: ["*platin", "*taxel", "*rubicin", "*tinib", tamoxifen, letrozol*, anastrozol*, exemestan*, aromatase inhibitor*, aromatasehemmer, antihormon*, endocrine therapy, hormone therapy, capecitabin*, fluorouracil, 5-fu, pembrolizumab, nivolumab]
      implies: {systemic_cancer_therapy: 0.9}
    vte:
      label: {en: Thrombosis or embolism, de: Thrombose oder Embolie}
      match: [embolism, embolie, pulmonary embol*, lungenembolie, thrombosis, thrombose, dvt, tvt, lae, "*embolie"]
      implies: {}
    pad:
      label: {en: Peripheral artery disease, de: Periphere arterielle Verschlusskrankheit}
      match: [claudicatio*, pad, pavk, peripheral arter*, schaufensterkrankheit, angioplast*, pta]
      implies: {region_limb: 1.0}
    caesarean:
      label: {en: Caesarean section, de: Kaiserschnitt}
      match: [caesarean, cesarean, c-section, sectio, kaiserschnitt]
      implies: {surgery_planned: 1.0, anaesthesia_planned: 1.0}
    imaging_test:
      label: {en: Imaging test, de: Bildgebung}
      match: ["*graphy", "*graphie", "*grafie", ultrasound, sonograph*, x-ray, roentgen*, scan, mammo*, bildgebung]
      implies: {}
    lab_abnormality:
      label: {en: Abnormal lab values, de: Auffällige Laborwerte}
      match: ["*aemia", "*emia", "*penia", "*penic", "*aemie", "*penie", "*paenie", "*zytose", "*cytosis", enzymes, lab values, laborwerte, blood count, blutbild, anaemi*, anemia]
      implies: {}
    oedema:
      label: {en: Swelling or oedema, de: Ödeme}
      match: [oedema, edema, oedemas, swollen ankles, swollen legs, swollen feet, ankle swelling, leg swelling,
              swelling of the legs, fluid retention, water retention, "*oedem", "*oedeme", oedeme, beinoedem*,
              geschwollene beine, geschwollene knoechel, geschwollene fuesse, wassereinlagerung*]
      implies: {region_limb: 0.8}
    adverse_drug_reaction:
      label: {en: Possible drug side effect, de: Mögliche Nebenwirkung}
      match: [since she started, since he started, since starting, after starting, after she started, side effect*,
              adverse effect*, adverse reaction*, drug reaction, nebenwirkung*, seit beginn, seit der einnahme,
              unvertraeglich*]
      implies: {}
    structural_heart_intervention:
      label: {en: Valve or structural heart intervention, de: Klappen- oder strukturelle Herzintervention}
      match: [tavi, tavr, transcatheter aortic valve, mitraclip, valve replacement, valve implantation,
              aortic stenosis, aortic valve, klappenersatz, aortenklappe*, aortenklappenstenose, herzklappe*]
      implies: {region_heart: 1.0, contrast_planned: 0.9, invasive_procedure: 0.9}
    pressure_ulcer:
      label: {en: Pressure ulcer, de: Dekubitus}
      match: [pressure ulcer*, pressure sore*, pressure injury, pressure injuries, pressure wound, bedsore*,
              bed sore*, decubitus, dekubitus, druckgeschwuer*, druckstelle*, wundliegen]
      implies: {region_skin: 0.8}
    qt_prolongation:
      label: {en: QT prolongation, de: QT-Verlängerung}
      match: [qt, qtc, qt prolongation, long qt, prolonged qt, qt interval, torsade*, qt verlaengerung,
              qt-zeit, verlaengerte qt]
      implies: {}
    gout:
      label: {en: Gout, de: Gicht}
      match: [gout, gouty, uric acid, hyperuricaemia, hyperuricemia, gicht, harnsaeure, hyperurikaemie]
      implies: {}
    electrolytes:
      label: {en: Electrolytes, de: Elektrolyte}
      match: [potassium, sodium, kalium, natrium, electrolyte*, elektrolyt*, magnesium, calcium, kalzium]
      implies: {lab_abnormality: 0.9}
    cardiac_bypass:
      label: {en: Coronary bypass surgery, de: Bypass-Operation}
      match: [bypass, cabg, coronary bypass, aortocoronary bypass, bypassoperation, acvb]
      implies: {surgery_planned: 1.0, region_heart: 1.0, focus_cardiac: 1.0}
    epistaxis:
      label: {en: Nosebleed, de: Nasenbluten}
      match: [nosebleed*, nose bleed*, epistaxis, nasenbluten]
      implies: {symptom_bleeding: 1.0}
    antidepressant:
      label: {en: Antidepressant, de: Antidepressivum}
      match: [ssri, snri, antidepressant*, sertraline, citalopram, escitalopram, fluoxetine, paroxetine, venlafaxine, duloxetine, mirtazapine, antidepressiv*]
      implies: {}
    bronchoscopy:
      label: {en: Bronchoscopy, de: Bronchoskopie}
      match: [bronchoscop*, bronchoskop*, ebus]
      implies: {invasive_procedure: 1.0, region_airway: 1.0, anaesthesia_planned: 0.7}
    endoscopy:
      label: {en: Endoscopy, de: Endoskopie}
      match: [colonoscop*, gastroscop*, endoscop*, ercp, koloskop*, gastroskop*, endoskop*, sigmoidoscop*]
      implies: {invasive_procedure: 0.9, region_gi: 0.9, anaesthesia_planned: 0.7}
    cystoscopy:
      label: {en: Cystoscopy, de: Zystoskopie}
      match: [cystoscop*, zystoskop*, turb, turp]
      implies: {invasive_procedure: 0.9, region_kidney: 0.6}
    tooth_extraction:
      label: {en: Tooth extraction, de: Zahnextraktion}
      match: [tooth extraction, extraction, dental implant, zahnextraktion, zahn ziehen, implantat setzen]
      implies: {invasive_procedure: 1.0, surgery_planned: 0.7}
    heart_catheter:
      label: {en: Cardiac catheterisation, de: Herzkatheter}
      match: [pci, coronary angiography, cardiac catheter*, heart catheter*, herzkatheter*, koronarangiograph*]
      implies: {contrast_planned: 1.0, region_heart: 1.0, invasive_procedure: 1.0}
    cataract_surgery:
      label: {en: Cataract surgery, de: Kataraktoperation}
      match: [cataract, katarakt*, grauer star]
      implies: {surgery_planned: 0.9, region_eye: 1.0}
    joint_replacement:
      label: {en: Joint replacement, de: Gelenkersatz}
      match: [hip replacement, knee replacement, arthroplast*, endoprothes*, tep, hueft tep, knie tep]
      implies: {surgery_planned: 1.0, region_joint: 1.0}
    tonsillectomy:
      label: {en: Tonsillectomy, de: Tonsillektomie}
      match: [tonsillectom*, tonsillektom*]
      implies: {surgery_planned: 1.0, region_airway: 1.0}
    endarterectomy:
      label: {en: Carotid endarterectomy, de: Karotis-Thrombendarteriektomie}
      match: [endarterectom*, endarteriektom*, carotid surgery, karotis op]
      implies: {surgery_planned: 1.0, region_head_neck: 1.0}
    laparoscopy:
      label: {en: Laparoscopic surgery, de: Laparoskopische Operation}
      match: [laparoscop*, laparoskop*, keyhole surgery]
      implies: {surgery_planned: 1.0, anaesthesia_planned: 1.0, region_gi: 0.6}
    ct_scan:
      label: {en: CT scan, de: CT}
      match: [ct, ct scan, computed tomography, computertomograph*]
      implies: {}

# ---------------------------------------------------------------------------
# Rules (hyperedges). `when` lists nodes that must all be active (ancestors count).
# ---------------------------------------------------------------------------
rules:
  # --- roles ---
  - id: physician_base
    when: [physician]
    critical: [allergies]
    high: [current_medication, active_problems]
    normal: [past_problems_surgeries, recent_admissions]
    sources: [IPS]

  - id: nursing_base
    when: [nursing]
    critical: [allergies]
    high: [current_medication, fall_risk_mobility, cognition_function, infection_isolation, vital_signs_latest]
    normal: [active_problems, social_history, devices_implants]
    sources: [IPS]

  - id: pharmacy_base
    when: [pharmacy]
    critical: [allergies, current_medication]
    high: [kidney_function, liver_function, anticoagulants, steroids_immunosuppressants]
    normal: [active_problems, weight_bmi]
    sources: [STOPP]

  - id: physiotherapy_base
    when: [physiotherapy]
    critical: [fall_risk_mobility]
    high: [vital_signs_latest, past_problems_surgeries, functional_capacity, cardiac_function]
    normal: [anticoagulants, planned_procedures, active_problems, allergies]
    sources: [IPS]

  - id: perioperative_base
    when: [perioperative]
    critical: [anticoagulants]
    high: [planned_procedures, coagulation_bleeding]
    sources: [ESAIC, WHO-SSC]

  - id: anaesthesiology_base
    when: [anaesthesiology]
    high: [previous_anaesthesia, airway_aspiration_risk, respiratory_status, cardiac_function, kidney_function]
    normal: [weight_bmi, diabetes_control, cardiac_rhythm]
    sources: [ESAIC]

  - id: intensive_care_base
    when: [intensive_care]
    critical: [allergies, active_problems]
    high: [current_medication, vital_signs_latest, respiratory_status, cardiac_function, kidney_function, coagulation_bleeding, anticoagulants, lab_results, infection_isolation]
    normal: [advance_directives, devices_implants]
    sources: [IPASS]

  - id: surgery_base
    when: [surgery]
    high: [imaging_findings]
    sources: [WHO-SSC]

  - id: visceral_surgery_base
    when: [visceral_surgery]
    high: [imaging_findings]
    normal: [liver_function, weight_bmi]
    sources: [ESAIC]

  - id: breast_surgery_base
    when: [breast_surgery]
    high: [cancer_histology, cancer_staging, tumour_receptors, tumour_board_plan]
    sources: [ESMO-MDT]

  - id: vascular_surgery_base
    when: [vascular_surgery]
    critical: [vascular_findings]
    high: [kidney_function, cardiac_function, neuro_findings]
    sources: [ESC-NCS]

  - id: trauma_orthopaedics_base
    when: [trauma_orthopaedics]
    high: [fall_risk_mobility, imaging_findings]
    normal: [steroids_immunosuppressants, antiresorptive_drugs]
    sources: [ESAIC]

  - id: cardiac_surgery_base
    when: [cardiac_surgery]
    critical: [cardiac_function]
    high: [cardiac_rhythm, kidney_function, vascular_findings, diabetes_control]
    normal: [functional_capacity]
    sources: [ESC-NCS]

  - id: thoracic_surgery_base
    when: [thoracic_surgery]
    high: [functional_capacity, imaging_findings, cardiac_function]
    normal: [social_history]
    sources: [ESAIC]

  - id: neurosurgery_base
    when: [neurosurgery]
    high: [neuro_findings, imaging_findings]
    sources: [IPS]

  - id: plastic_surgery_base
    when: [plastic_surgery]
    normal: [social_history, diabetes_control, steroids_immunosuppressants]
    sources: [ESAIC]

  - id: urology_base
    when: [urology]
    high: [kidney_function, imaging_findings]
    sources: [IPS]

  - id: ent_base
    when: [ent]
    high: [airway_aspiration_risk]
    sources: [ESAIC]

  - id: dentistry_base
    when: [dentistry]
    critical: [antiresorptive_drugs]
    high: [coagulation_bleeding]
    normal: [steroids_immunosuppressants, diabetes_control, devices_implants]
    note: Bisphosphonates raise the risk of jaw osteonecrosis after extractions.
    sources: [STOPP]

  - id: gynaecology_base
    when: [gynaecology]
    high: [pregnancy, cancer_histology, imaging_findings]
    normal: [family_history]
    sources: [IPS]

  - id: ophthalmology_base
    when: [ophthalmology]
    critical: [eye_findings]
    high: [diabetes_control, blood_pressure, vascular_findings]
    sources: [ADA]

  - id: internal_medicine_base
    when: [internal_medicine]
    high: [lab_results, vital_signs_latest]
    normal: [kidney_function]
    sources: [IPS]

  - id: cardiology_base
    when: [cardiology]
    critical: [cardiac_function]
    high: [cardiac_rhythm, blood_pressure, antihypertensives, anticoagulants, vascular_findings]
    sources: [ESC-NCS]

  - id: angiology_base
    when: [angiology]
    critical: [vascular_findings]
    high: [anticoagulants, blood_pressure]
    sources: [IPS]

  - id: endocrinology_base
    when: [endocrinology]
    critical: [diabetes_control, glucose_lowering]
    high: [weight_bmi, kidney_function, eye_findings, current_medication]
    sources: [ADA]

  - id: nephrology_base
    when: [nephrology]
    critical: [kidney_function]
    high: [contrast_relevant_meds, blood_pressure, antihypertensives, current_medication]
    normal: [diabetes_control]
    sources: [ESUR, STOPP]

  - id: gastroenterology_base
    when: [gastroenterology]
    critical: [liver_function]
    high: [coagulation_bleeding, imaging_findings, anticoagulants]
    sources: [IPS]

  - id: oncology_base
    when: [oncology]
    critical: [cancer_histology, cancer_staging]
    high: [tumour_receptors, tumour_board_plan, cognition_function, planned_procedures]
    normal: [family_history]
    sources: [ESMO-MDT]

  - id: pulmonology_base
    when: [pulmonology]
    critical: [respiratory_status]
    high: [active_problems, current_medication, vital_signs_latest]
    normal: [social_history, cardiac_function, imaging_findings]
    sources: [IPS]

  - id: rheumatology_base
    when: [rheumatology]
    critical: [steroids_immunosuppressants]
    high: [kidney_function, lab_results, active_problems, current_medication]
    sources: [IPS]

  - id: infectiology_base
    when: [infectiology]
    critical: [infection_isolation]
    high: [allergies, lab_results, devices_implants, vital_signs_latest]
    sources: [IPS]

  - id: geriatrics_base
    when: [geriatrics]
    critical: [current_medication]
    high: [fall_risk_mobility, cognition_function, kidney_function, anticoagulants]
    normal: [social_history, advance_directives, weight_bmi]
    sources: [STOPP]

  - id: emergency_medicine_base
    when: [emergency_medicine]
    critical: [anticoagulants]
    high: [prior_similar_events, vital_signs_latest, active_problems]
    normal: [recent_admissions]
    sources: [SAMPLE]

  - id: general_practice_base
    when: [general_practice]
    high: [followups_recommended, blood_pressure, weight_bmi]
    normal: [vital_signs_latest, social_history, family_history]
    sources: [IPS, IPASS]

  - id: radiology_base
    when: [radiology]
    critical: [contrast_reaction]
    high: [kidney_function, contrast_relevant_meds, devices_implants, imaging_findings]
    normal: [pregnancy]
    sources: [ESUR]

  - id: nuclear_medicine_base
    when: [nuclear_medicine]
    high: [pregnancy, kidney_function, imaging_findings]
    normal: [current_medication]
    sources: [IPS]

  - id: radiation_oncology_base
    when: [radiation_oncology]
    critical: [cancer_histology, cancer_staging]
    high: [devices_implants, tumour_board_plan, planned_procedures]
    normal: [pregnancy]
    sources: [ESMO-MDT]

  - id: neurology_base
    when: [neurology]
    critical: [neuro_findings]
    high: [vascular_findings, anticoagulants, prior_similar_events]
    sources: [IPS]

  - id: psychiatry_base
    when: [psychiatry]
    high: [current_medication, cognition_function]
    normal: [social_history]
    sources: [STOPP]

  - id: dermatology_base
    when: [dermatology]
    high: [current_medication, allergies]
    normal: [steroids_immunosuppressants]
    sources: [IPS]

  - id: paediatrics_base
    when: [paediatrics]
    high: [weight_bmi, allergies]
    sources: [IPS]

  - id: occupational_medicine_base
    when: [occupational_medicine]
    high: [current_medication, active_problems, functional_capacity]
    normal: [diabetes_control, cognition_function, social_history]
    sources: [IPS]

  - id: sports_medicine_base
    when: [sports_medicine]
    critical: [cardiac_function]
    high: [cardiac_rhythm, blood_pressure, current_medication, functional_capacity]
    normal: [family_history]
    sources: [ESC-NCS]

  - id: palliative_care_base
    when: [palliative_care]
    critical: [current_medication, advance_directives]
    high: [active_problems, social_history, cognition_function]
    normal: [kidney_function]
    sources: [IPS, STOPP]

  - id: midwifery_base
    when: [midwifery]
    critical: [pregnancy, allergies]
    high: [current_medication]
    normal: [blood_pressure, diabetes_control]
    sources: [IPS]

  - id: rehabilitation_base
    when: [rehabilitation]
    high: [fall_risk_mobility, functional_capacity, cognition_function]
    sources: [IPS]

  # --- tasks ---
  - id: preop_task
    when: [preop]
    critical: [allergies, anticoagulants, cardiac_function]
    high: [current_medication, previous_anaesthesia, airway_aspiration_risk, respiratory_status, functional_capacity, kidney_function, coagulation_bleeding, diabetes_control, planned_procedures]
    normal: [weight_bmi, steroids_immunosuppressants, devices_implants, fasting_last_intake]
    sources: [ESAIC, ESC-NCS, WHO-SSC]

  - id: surgery_planning_task
    when: [surgery_planning]
    critical: [planned_procedures]
    high: [imaging_findings, anticoagulants]
    sources: [WHO-SSC]

  - id: tumour_board_task
    when: [tumour_board]
    critical: [cancer_histology, cancer_staging, tumour_receptors, tumour_board_plan]
    high: [imaging_findings, planned_procedures, cognition_function]
    normal: [family_history]
    sources: [ESMO-MDT]

  - id: emergency_task
    when: [emergency]
    critical: [allergies, anticoagulants]
    high: [current_medication, active_problems, prior_similar_events, vital_signs_latest]
    normal: [recent_admissions, fasting_last_intake]
    sources: [SAMPLE]

  - id: admission_task
    when: [admission]
    critical: [allergies, current_medication]
    high: [active_problems, vital_signs_latest]
    normal: [recent_admissions, infection_isolation, past_problems_surgeries]
    sources: [IPASS, IPS]

  - id: chronic_review_task
    when: [chronic_review]
    high: [current_medication, followups_recommended]
    normal: [lab_results, vital_signs_latest]
    sources: [ADA]

  - id: followup_review_task
    when: [followup_review]
    critical: [followups_recommended, followups_completed]
    high: [recent_admissions, planned_procedures]
    normal: [imaging_findings, vascular_findings]
    sources: [IPASS]

  - id: medication_review_task
    when: [medication_review]
    critical: [current_medication]
    high: [allergies, kidney_function, liver_function, anticoagulants]
    normal: [steroids_immunosuppressants, weight_bmi]
    sources: [STOPP]

  - id: handover_task
    when: [handover]
    critical: [active_problems]
    high: [current_medication, allergies, followups_recommended, planned_procedures]
    sources: [IPASS]

  # --- context ---
  - id: surgery_context
    when: [surgery_planned]
    high: [anticoagulants, coagulation_bleeding, planned_procedures]
    sources: [ESAIC, WHO-SSC]

  - id: anaesthesia_context
    when: [anaesthesia_planned]
    high: [previous_anaesthesia, airway_aspiration_risk, allergies]
    normal: [fasting_last_intake]
    sources: [ESAIC]

  - id: neuraxial_context
    when: [neuraxial_anaesthesia]
    critical: [anticoagulants, coagulation_bleeding]
    sources: [ESAIC]

  - id: invasive_context
    when: [invasive_procedure]
    critical: [anticoagulants]
    high: [coagulation_bleeding, allergies]
    sources: [ESAIC]

  - id: postop_context
    when: [postop]
    high: [past_problems_surgeries, vital_signs_latest, current_medication, anticoagulants]
    normal: [infection_isolation]
    sources: [IPASS]

  - id: contrast_context
    when: [contrast_planned]
    critical: [contrast_reaction, kidney_function, contrast_relevant_meds]
    high: [allergies, glucose_lowering]
    normal: [pregnancy]
    sources: [ESUR]

  - id: mri_context
    when: [mri_planned]
    critical: [devices_implants]
    normal: [kidney_function, pregnancy]
    sources: [IPS]

  - id: ct_context
    when: [ct_scan]
    normal: [pregnancy, kidney_function]
    sources: [ESUR]

  - id: radiotherapy_context
    when: [radiotherapy_planned]
    high: [devices_implants]
    normal: [pregnancy]
    sources: [ESMO-MDT]

  - id: breast_context
    when: [region_breast]
    normal: [imaging_findings, planned_procedures, cancer_histology, cancer_staging]
    sources: [ESMO-MDT]

  - id: liver_context
    when: [region_liver]
    critical: [liver_function]
    high: [coagulation_bleeding]
    sources: [ESAIC]

  - id: kidney_context
    when: [region_kidney]
    critical: [kidney_function]
    sources: [IPS]

  - id: heart_context
    when: [region_heart]
    critical: [cardiac_function]
    high: [cardiac_rhythm]
    sources: [ESC-NCS]

  - id: head_neck_context
    when: [region_head_neck]
    high: [neuro_findings, vascular_findings]
    sources: [IPS]

  - id: eye_context
    when: [region_eye]
    high: [eye_findings]
    sources: [IPS]

  - id: airway_context
    when: [region_airway]
    high: [airway_aspiration_risk]
    sources: [ESAIC]

  - id: joint_context
    when: [region_joint]
    high: [anticoagulants]
    normal: [fall_risk_mobility, devices_implants, antiresorptive_drugs]
    sources: [ESAIC]

